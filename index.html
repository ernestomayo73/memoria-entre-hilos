<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>ENERGIZADOS</title>
    <link rel="icon" href="./fotos/FAVICOM_Mesa de trabajo 1.ico">
    <link rel="stylesheet" href="sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Agrega un estilo para ocultar la pantalla de bienvenida al comienzo */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="bienvenida">
        <div class="welcome-content">
            <h1><img src="./fotos/energizados.png" alt=""></h1>
            <button class="start" onclick="comenzarJuego()">Comenzar</button>
        </div>
    </div>
    <main>
        <section class="section1" id="juego" style="display: block;">
            <!-- Contenido del juego aquí -->
            <h1><img src="./fotos/energizados.png" alt=""></h1>
            <table>
                <tr>
                    <td><button id="0" onclick="destapar(0)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="1" onclick="destapar(1)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="2" onclick="destapar(2)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="3" onclick="destapar(3)"><img src="./fotos/fondo.png" alt=""></button></td>
                </tr>
                <tr>
                    <td><button id="4" onclick="destapar(4)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="5" onclick="destapar(5)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="6" onclick="destapar(6)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="7" onclick="destapar(7)"><img src="./fotos/fondo.png" alt=""></button></td>
                </tr>
                <tr>
                    <td><button id="8" onclick="destapar(8)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="9" onclick="destapar(9)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="10" onclick="destapar(10)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="11" onclick="destapar(11)"><img src="./fotos/fondo.png" alt=""></button></td>
                </tr>
                <tr>
                    <td><button id="12" onclick="destapar(12)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="13" onclick="destapar(13)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="14" onclick="destapar(14)"><img src="./fotos/fondo.png" alt=""></button></td>
                    <td><button id="15" onclick="destapar(15)"><img src="./fotos/fondo.png" alt=""></button></td>
                </tr>
            </table>
        </section>
        <section class="section2">
            <h2 id="Aciertos" class="estadisticas">Aciertos: 0</h2>
            <h2 id="Tiempo restante" class="estadisticas">Tiempo: 30 segundos</h2>
            <h2 id="Movimientos" class="estadisticas">Movimientos: 0</h2>
            <h2> <button id="start" class="start" onclick="window.location.reload();">Volvamos a jugar!</button></h2>
        </section>
    </main>
    <footer>
        <button id="btn-refresh">Actualizar Página</button>
    </footer>
    <audio autoplay loop>
        <source src="sonidos/fondo.wav" type="audio/wav">
    </audio>
    <script>
        document.getElementById('btn-refresh').addEventListener('click', function() {
            location.reload();
        });

        function comenzarJuego() {
            // Ocultar la pantalla de bienvenida al presionar "Comenzar"
            document.getElementById('bienvenida').classList.add('hidden');
        }
    </script>
    <script src="main.js"></script>
</body>
</html>
